name = sam
summary = "SAM (Software Automatic Mouth) Synthesizer"
description = """A retro text-to-speech synthesizer based on the 1982 Software Automatic Mouth for Commodore 64. Provides a distinctive robotic voice with adjustable pitch, speed, and voice characteristics. Uses a native renderer for low latency, falling back to pure Python if it cannot be loaded."""
